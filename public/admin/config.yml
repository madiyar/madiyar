backend:
  name: github
  repo: madiyar/madiyar
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth
  squash_merges: true
  local_backend: true

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "resume"
    label: "Resume"
    files:
      - file: "/resume/resume.json"
        label: "Resume JSON"
        name: "resumejson"
        format: "json"
        fields:
          - label: "Basics"
            name: "basics"
            widget: object
            fields:
              - { label: "Name", name: "name", widget: string }
              - { label: "Label", name: "label", widget: string }
              - { label: "Email", name: "email", widget: string }
              - { label: "URL", name: "url", widget: string }
              - { label: "Birthday", name: "birthday", widget: string }
              - label: "Location"
                name: "location"
                widget: object
                fields:
                  - { label: "City", name: "city", widget: string }
                  - { label: "Country", name: "country", widget: string }
              - label: "Profiles"
                name: "profiles"
                widget: list
                fields:
                  - { label: "Network", name: "network", widget: string }
                  - { label: "Username", name: "username", widget: string }
                  - { label: "URL", name: "url", widget: string }

          - label: "Work Experience"
            name: "work"
            widget: list
            fields:
              - { label: "Company", name: "name", widget: string }
              - { label: "URL", name: "url", widget: string }
              - { label: "Position", name: "position", widget: string }
              - { label: "City", name: "city", widget: string }
              - { label: "Country", name: "country", widget: string }
              - { label: "Start Date", name: "startDate", widget: datetime }
              - { label: "End Date", name: "endDate", widget: datetime, required: false }
              - label: "Projects"
                name: "projects"
                widget: list
                fields:
                  - { label: "Name", name: "name", widget: string }
                  - { label: "Stack", name: "stack", widget: string }
                  - label: "Highlights"
                    name: "highlights"
                    widget: list
                    field: { label: "Highlight", name: "item", widget: text }

          - label: "Education"
            name: "education"
            widget: list
            fields:
              - { label: "Institution", name: "institution", widget: string }
              - { label: "Area", name: "area", widget: string }
              - { label: "Study Type", name: "studyType", widget: string }
              - { label: "Start Date", name: "startDate", widget: datetime }
              - { label: "End Date", name: "endDate", widget: datetime }
              - { label: "Score", name: "score", widget: string }

          - label: "Skills"
            name: "skills"
            widget: list
            fields:
              - { label: "Name", name: "name", widget: string }
              - { label: "Keywords", name: "keywords", widget: list, field: { label: "Keyword", name: "keyword", widget: string } }

          - label: "Languages"
            name: "languages"
            widget: list
            fields:
              - { label: "Language", name: "language", widget: string }
              - { label: "Fluency", name: "fluency", widget: string }

          - label: "Projects"
            name: "projects"
            widget: list
            fields:
              - { label: "Name", name: "name", widget: string }
              - { label: "URL", name: "url", widget: string }
              - { label: "Summary", name: "summary", widget: text }
              - { label: "Keywords", name: "keywords", widget: list, field: { label: "Keyword", name: "keyword", widget: string } }
